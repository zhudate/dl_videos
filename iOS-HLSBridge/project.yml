name: HLSBridge
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES


packages:
  ffmpegkit:
    url: https://github.com/jaywcjlove/ffmpeg-kit.git
    branch: main

targets:
  HLSBridge:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    dependencies:
      - target: HLSBridgeSafariExtension
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - package: ffmpegkit
        product: ffmpegkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.hlsbridge
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: HLSBridge
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: []
      gatherCoverageData: false

  HLSBridgeSafariExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SafariExtension/SafariWebExtensionHandler.swift
      - path: SafariExtension/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.hlsbridge.SafariExtension
        INFOPLIST_FILE: SafariExtension/Info.plist
        PRODUCT_NAME: HLSBridgeSafariExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
